[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roomba-mcp"
version = "0.1.0"
description = "MCP server for a Roomba Combo j9+ with local LSS control and AWS IoT fallback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "auss" }]
keywords = ["roomba", "irobot", "mcp", "mqtt", "home-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
]
dependencies = [
  "mcp>=2.3,<3",
  "paho-mqtt>=2.1,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
roomba-mcp = "roomba_mcp.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/roomba_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:roomba_mcp.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true
